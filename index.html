      <!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8" />

<title>LIQUIDATED Referral Awards — Unlock Extraordinary Rewards</title>
<meta name="description" content="Every referral brings you closer to something extraordinary. Confirm 5 investors, unlock a reward. Go all the way to 2,000 — and we'll put you in a car." />
<meta name="theme-color" content="#04130d" />
<meta property="og:title" content="LIQUIDATED Referral Awards" />
<meta property="og:description" content="12 tiers. Real rewards. From branded merch to a luxury vehicle." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>" />

<style>
/* ==========================================================================
   LIQUIDATED AWARDS — DESIGN SYSTEM
   ========================================================================== */
:root{
  --bg-primary:#04130d;
  --bg-elevated:#0a261a;
  --bg-highest:#0f3324;
  --bg-glass:rgba(10,38,26,.72);

  --gold-500:#d4af37;
  --gold-300:#f6d054;
  --gold-700:#a8861f;

  --emerald-500:#10b981;
  --emerald-600:#059669;
  --emerald-400:#34d399;

  --danger:#f43f5e;
  --warn:#fbbf24;
  --info:#38bdf8;

  --text-hi:#fbf8f0;
  --text-mid:#c8dfd2;
  --text-lo:#7fa595;

  --r1:10px; --r2:14px; --r3:20px; --r4:26px; --r5:34px; --rpill:999px;

  --shadow-soft:0 14px 38px rgba(0,0,0,.42);
  --shadow-ring:0 0 0 1px rgba(212,175,55,.14);
  --shadow-lift:0 22px 52px rgba(0,0,0,.55), 0 0 0 1px rgba(212,175,55,.22);
  --glow-gold:0 0 32px rgba(212,175,55,.28);
  --glow-emerald:0 0 32px rgba(16,185,129,.26);

  --ease-fast:cubic-bezier(.4,0,.2,1);
  --ease-base:cubic-bezier(.16,1,.3,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);

  --t-fast:180ms;
  --t-base:320ms;
  --t-slow:620ms;

  --dock-h:68px;
  --top-h:60px;
}

*,*::before,*::after{box-sizing:border-box;}

html,body{height:100%;}
body{
  margin:0;
  background:var(--bg-primary);
  color:var(--text-hi);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}

::selection{background:rgba(212,175,55,.3);color:#fff;}

/* Scrollbar */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,.02);}
::-webkit-scrollbar-thumb{background:rgba(212,175,55,.28);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(212,175,55,.5);}

h1,h2,h3,h4,.font-display{
  font-family:'Fraunces',Georgia,serif;
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1.12;
}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}

a{color:var(--gold-300);text-decoration:none;transition:color var(--t-fast) var(--ease-fast);}
a:hover{color:var(--gold-500);}

/* ==========================================================================
   AMBIENT BACKGROUND — Beautification Algorithm A + B
   ========================================================================== */
.ambient{
  position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:
    radial-gradient(900px 600px at 12% -6%, rgba(212,175,55,.10), transparent 62%),
    radial-gradient(800px 620px at 92% 8%, rgba(16,185,129,.10), transparent 60%),
    radial-gradient(1000px 700px at 50% 108%, rgba(212,175,55,.06), transparent 65%),
    var(--bg-primary);
}
.orb{
  position:absolute; border-radius:50%; filter:blur(80px); opacity:.42;
  will-change:transform; transform:translateZ(0);
}
.orb-1{width:340px;height:340px;background:radial-gradient(circle,rgba(212,175,55,.55),transparent 70%);top:-90px;left:-80px;animation:drift1 26s ease-in-out infinite;}
.orb-2{width:300px;height:300px;background:radial-gradient(circle,rgba(16,185,129,.5),transparent 70%);top:32%;right:-110px;animation:drift2 32s ease-in-out infinite;}
.orb-3{width:400px;height:400px;background:radial-gradient(circle,rgba(246,208,84,.28),transparent 70%);bottom:-140px;left:22%;animation:drift3 38s ease-in-out infinite;}

@keyframes drift1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(70px,50px) scale(1.14);}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-60px,70px) scale(1.1);}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(50px,-60px) scale(1.08);}}

body.tab-hidden .orb{animation-play-state:paused;}

@media (max-width:640px){
  .orb{opacity:.26;filter:blur(60px);}
}

/* Grid texture overlay */
.ambient::after{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.014) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);
  background-size:52px 52px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 78%);
}

#confettiCanvas{
  position:fixed; inset:0; z-index:9998; pointer-events:none;
}

/* ==========================================================================
   LAYOUT SHELL
   ========================================================================== */
#app{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;}

#view{
  flex:1;
  padding-top:calc(var(--top-h) + 12px);
  padding-bottom:32px;
  max-width:1240px;
  width:100%;
  margin:0 auto;
  padding-left:14px;
  padding-right:14px;
}
body.has-dock #view{padding-bottom:calc(var(--dock-h) + 34px + env(safe-area-inset-bottom));}

.view-enter{animation:viewIn var(--t-base) var(--ease-base) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

/* ==========================================================================
   TOP BAR
   ========================================================================== */
#topbar{
  position:fixed;top:0;left:0;right:0;height:var(--top-h);z-index:900;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  padding-top:env(safe-area-inset-top);
  height:calc(var(--top-h) + env(safe-area-inset-top));
  background:rgba(4,19,13,.72);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  border-bottom:1px solid rgba(212,175,55,.1);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.06em;font-size:.82rem;color:var(--text-hi);}
.brand-mark{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-700) 55%,#6b5410);
  box-shadow:var(--glow-gold);font-size:1rem;color:#04130d;font-weight:900;
}
.brand-sub{color:var(--gold-500);font-weight:600;letter-spacing:.22em;font-size:.6rem;display:block;margin-top:-2px;}
.topbar-spacer{flex:1;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);
  color:var(--text-mid);font-size:1.05rem;cursor:pointer;position:relative;
  transition:all var(--t-fast) var(--ease-fast);
}
.icon-btn:hover,.icon-btn:focus-visible{background:rgba(212,175,55,.14);color:var(--gold-300);border-color:rgba(212,175,55,.32);transform:translateY(-1px);}
.icon-btn:active{transform:scale(.94);}
.dot-badge{
  position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--danger);color:#fff;font-size:.6rem;font-weight:700;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg-primary);
  animation:pulseDot 2.2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

/* ==========================================================================
   BOTTOM DOCK
   ========================================================================== */
#bottomDock{
  position:fixed;bottom:0;left:0;right:0;z-index:900;
  height:calc(var(--dock-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:none;
  background:rgba(6,24,16,.86);
  backdrop-filter:blur(20px) saturate(150%);
  -webkit-backdrop-filter:blur(20px) saturate(150%);
  border-top:1px solid rgba(212,175,55,.13);
}
body.has-dock #bottomDock{display:block;}
.dock-inner{display:flex;height:var(--dock-h);align-items:stretch;}
.dock-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-lo);font-size:.62rem;font-weight:600;letter-spacing:.02em;
  border:0;background:none;cursor:pointer;position:relative;
  transition:color var(--t-fast) var(--ease-fast);
  -webkit-tap-highlight-color:transparent;
}
.dock-item i{font-size:1.2rem;transition:transform var(--t-base) var(--ease-spring);}
.dock-item.active{color:var(--gold-300);}
.dock-item.active i{transform:translateY(-3px) scale(1.16);filter:drop-shadow(0 0 10px rgba(212,175,55,.6));}
.dock-item.active::before{
  content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--gold-500),var(--emerald-500));
  box-shadow:0 0 14px rgba(212,175,55,.7);
}
.dock-item:active i{transform:scale(.88);}

/* ==========================================================================
   CARDS / SURFACES
   ========================================================================== */
.surface{
  background:linear-gradient(160deg,rgba(15,51,36,.92),rgba(10,38,26,.86));
  border:1px solid rgba(212,175,55,.12);
  border-radius:var(--r4);
  box-shadow:var(--shadow-soft);
  position:relative;
  overflow:hidden;
}
.surface::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.055),transparent 42%);
}
.surface-pad{padding:20px;}

.glass{
  background:var(--bg-glass);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  border:1px solid rgba(255,255,255,.07);
  border-radius:var(--r3);
}

.card-hover{transition:transform var(--t-base) var(--ease-base),box-shadow var(--t-base) var(--ease-base),border-color var(--t-base) var(--ease-base);}
.card-hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:rgba(212,175,55,.3);}

/* ==========================================================================
   TYPOGRAPHY HELPERS
   ========================================================================== */
.t-hi{color:var(--text-hi);}
.t-mid{color:var(--text-mid);}
.t-lo{color:var(--text-lo);}
.t-gold{color:var(--gold-300);}
.t-emerald{color:var(--emerald-400);}
.t-danger{color:var(--danger);}
.eyebrow{
  font-size:.66rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:var(--gold-500);opacity:.9;
}
.grad-gold{
  background:linear-gradient(100deg,#f6d054 0%,#d4af37 42%,#fff3c4 70%,#d4af37 100%);
  background-size:220% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 7s linear infinite;
}
@keyframes shine{to{background-position:220% center;}}

.section-title{font-size:clamp(1.35rem,4.6vw,2.1rem);}
.section-sub{color:var(--text-mid);font-size:.9rem;max-width:640px;}

/* ==========================================================================
   BUTTONS
   ========================================================================== */
.btn-liq{
  --bg:linear-gradient(135deg,var(--gold-500),var(--gold-700));
  background:var(--bg);
  color:#07160f;font-weight:700;border:0;border-radius:var(--r2);
  padding:.72rem 1.25rem;font-size:.88rem;letter-spacing:.01em;
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform var(--t-fast) var(--ease-spring),box-shadow var(--t-base) var(--ease-base),filter var(--t-fast);
  box-shadow:0 8px 22px rgba(212,175,55,.24);
  -webkit-tap-highlight-color:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  min-height:44px;
}
.btn-liq:hover{filter:brightness(1.09);box-shadow:0 12px 30px rgba(212,175,55,.38);transform:translateY(-2px);}
.btn-liq:active{transform:translateY(0) scale(.97);}
.btn-liq::after{
  content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:skewX(-22deg);
}
.btn-liq:hover::after{animation:sheen .85s var(--ease-base);}
@keyframes sheen{to{left:140%;}}
.btn-liq:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none;}

.btn-emerald{
  background:linear-gradient(135deg,var(--emerald-500),var(--emerald-600));
  color:#03130c;box-shadow:0 8px 22px rgba(16,185,129,.24);
}
.btn-emerald:hover{box-shadow:0 12px 30px rgba(16,185,129,.36);}

.btn-ghost{
  background:rgba(255,255,255,.05);color:var(--text-hi);
  border:1px solid rgba(255,255,255,.12);box-shadow:none;
}
.btn-ghost:hover{background:rgba(212,175,55,.12);border-color:rgba(212,175,55,.35);color:var(--gold-300);box-shadow:none;}

.btn-outline-gold{
  background:transparent;color:var(--gold-300);
  border:1px solid rgba(212,175,55,.42);box-shadow:none;
}
.btn-outline-gold:hover{background:rgba(212,175,55,.12);box-shadow:var(--glow-gold);}

.btn-sm-liq{padding:.5rem .85rem;font-size:.78rem;min-height:38px;border-radius:var(--r1);}
.btn-xs-liq{padding:.32rem .62rem;font-size:.7rem;min-height:32px;border-radius:9px;}
.btn-block{width:100%;}

/* ==========================================================================
   BADGES / PILLS
   ========================================================================== */
.pill{
  display:inline-flex;align-items:center;gap:.32rem;
  padding:.28rem .62rem;border-radius:var(--rpill);
  font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid transparent;white-space:nowrap;
}
.pill-gold{background:rgba(212,175,55,.14);color:var(--gold-300);border-color:rgba(212,175,55,.34);}
.pill-emerald{background:rgba(16,185,129,.14);color:var(--emerald-400);border-color:rgba(16,185,129,.34);}
.pill-danger{background:rgba(244,63,94,.14);color:#fda4af;border-color:rgba(244,63,94,.34);}
.pill-muted{background:rgba(255,255,255,.05);color:var(--text-lo);border-color:rgba(255,255,255,.1);}
.pill-info{background:rgba(56,189,248,.13);color:#7dd3fc;border-color:rgba(56,189,248,.3);}

/* ==========================================================================
   TIER SYSTEM
   ========================================================================== */
.tier-shield{filter:drop-shadow(0 6px 16px rgba(0,0,0,.5));}
.tier-shield.glow{animation:badgeGlow 4.5s ease-in-out infinite;}
@keyframes badgeGlow{
  0%,100%{filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)) drop-shadow(0 0 0px currentColor);}
  50%{filter:drop-shadow(0 6px 16px rgba(0,0,0,.5)) drop-shadow(0 0 14px currentColor);}
}

/* Vertical ladder */
.ladder{position:relative;padding-left:6px;}
.ladder-rail{
  position:absolute;left:35px;top:14px;bottom:14px;width:2px;border-radius:2px;
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.14) 0 8px,transparent 8px 16px);
}
.ladder-rail-fill{
  position:absolute;left:35px;top:14px;width:2px;border-radius:2px;
  background:linear-gradient(to bottom,var(--gold-500),var(--emerald-500));
  box-shadow:0 0 16px rgba(212,175,55,.55);
  transition:height 1s var(--ease-base);
}
.ladder-node{position:relative;padding-left:70px;margin-bottom:14px;}
.ladder-dot{
  position:absolute;left:20px;top:24px;width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;font-size:.85rem;
  background:var(--bg-highest);border:2px solid rgba(255,255,255,.16);
  transition:all var(--t-base) var(--ease-spring);z-index:2;
}
.ladder-node.unlocked .ladder-dot{border-color:var(--gold-500);background:linear-gradient(135deg,rgba(212,175,55,.3),rgba(10,38,26,.9));box-shadow:0 0 18px rgba(212,175,55,.42);}
.ladder-node.current .ladder-dot{border-color:var(--emerald-500);box-shadow:0 0 0 6px rgba(16,185,129,.14),0 0 22px rgba(16,185,129,.5);animation:pulseRing 2.4s ease-in-out infinite;}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 6px rgba(16,185,129,.14),0 0 22px rgba(16,185,129,.5);}50%{box-shadow:0 0 0 12px rgba(16,185,129,.05),0 0 30px rgba(16,185,129,.7);}}
.ladder-node.locked .ladder-dot{opacity:.55;}

.tier-card{
  background:linear-gradient(150deg,rgba(15,51,36,.9),rgba(8,30,20,.88));
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--r3);
  padding:16px;
  position:relative;overflow:hidden;
  transition:transform var(--t-base) var(--ease-base),box-shadow var(--t-base) var(--ease-base),border-color var(--t-base);
  cursor:pointer;
}
.tier-card::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent,var(--gold-500));
  box-shadow:0 0 18px var(--accent,var(--gold-500));
}
.tier-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:rgba(212,175,55,.28);}
.tier-card.locked{opacity:.66;}
.tier-card.locked::after{
  content:'';position:absolute;inset:0;backdrop-filter:blur(1.2px);pointer-events:none;
}
.tier-card.claimable{
  border-color:rgba(212,175,55,.5);
  box-shadow:0 0 0 1px rgba(212,175,55,.28),0 0 34px rgba(212,175,55,.18);
}
.tier-card.claimable .ribbon{
  position:absolute;top:12px;right:-32px;transform:rotate(38deg);
  background:linear-gradient(135deg,var(--gold-500),var(--gold-700));
  color:#07160f;font-size:.6rem;font-weight:800;letter-spacing:.12em;
  padding:4px 38px;box-shadow:0 4px 14px rgba(0,0,0,.4);
  animation:ribbonPulse 2.4s ease-in-out infinite;
}
@keyframes ribbonPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.22);}}

.tier-card.shake{animation:shake .42s var(--ease-fast);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

/* Grid view */
.tier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}

/* ==========================================================================
   PROGRESS
   ========================================================================== */
.bar{
  height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative;
}
.bar-fill{
  height:100%;border-radius:99px;width:0;
  background:linear-gradient(90deg,var(--gold-500),var(--emerald-500));
  transition:width 1.1s var(--ease-base);
  position:relative;overflow:hidden;
}
.bar-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:barShimmer 2.4s linear infinite;
}
@keyframes barShimmer{from{transform:translateX(-100%);}to{transform:translateX(100%);}}

.ring-fg{transition:stroke-dashoffset 1.3s var(--ease-base);}
.ring-label{fill:var(--text-hi);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;}

/* Status pipeline */
.pipeline{display:flex;align-items:center;gap:0;margin:14px 0;}
.pipe-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
.pipe-dot{
  width:16px;height:16px;border-radius:50%;background:var(--bg-highest);
  border:2px solid rgba(255,255,255,.16);z-index:2;transition:all var(--t-base);
}
.pipe-step.done .pipe-dot{background:var(--emerald-500);border-color:var(--emerald-500);box-shadow:0 0 12px rgba(16,185,129,.6);}
.pipe-step.active .pipe-dot{background:var(--gold-500);border-color:var(--gold-500);box-shadow:0 0 0 5px rgba(212,175,55,.18);animation:pulseRing 2s infinite;}
.pipe-line{position:absolute;top:7px;left:50%;width:100%;height:2px;background:rgba(255,255,255,.1);z-index:1;}
.pipe-step:last-child .pipe-line{display:none;}
.pipe-step.done .pipe-line{background:var(--emerald-500);}
.pipe-label{font-size:.6rem;color:var(--text-lo);text-transform:uppercase;letter-spacing:.06em;font-weight:600;text-align:center;}
.pipe-step.done .pipe-label,.pipe-step.active .pipe-label{color:var(--text-mid);}

/* ==========================================================================
   FORMS
   ========================================================================== */
.form-label-liq{
  font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;

/* ==========================================================================
   3. MOCK API (mirrors backend endpoints)
   ========================================================================== */
const API = {
  _latency: 140,

  async _wait(){ if(this._latency) await sleep(this._latency + Math.random()*90); },

  _user(userId){ return DB.data.users.find(u => u._id === userId) || null; },

  /* GET /api/auth/login */
  async login(email, password){
    await this._wait();
    const u = DB.data.users.find(x => x.email.toLowerCase() === String(email).toLowerCase().trim());
    if(!u) throw new Error('No account found with that email.');
    if(u.password !== password) throw new Error('Incorrect password. Please try again.');
    const token = 'jwt_' + btoa(u._id + ':' + now()).replace(/=/g,'');
    DB.data.session = { userId: u._id, token, at: now() };
    DB.save();
    return { token, user: this._publicUser(u) };
  },

  /* POST /api/auth/register */
  async register({ name, email, password, phone, referralCode }){
    await this._wait();
    if(DB.data.users.some(u => u.email.toLowerCase() === email.toLowerCase())){
      throw new Error('An account with that email already exists.');
    }
    const u = {
      _id: uid('u'),
      name, email, password, phone: phone || '',
      referral_code: 'LIQ-' + name.slice(0,3).toUpperCase().replace(/\s/g,'') + Math.floor(1000+Math.random()*8999),
      referred_by: null,
      kyc_verified: false,
      referral_count: 0,
      created_at: now()
    };
    DB.data.users.push(u);
    DB.data.session = { userId: u._id, token: 'jwt_' + btoa(u._id), at: now() };
    DB.save();
    return { token: DB.data.session.token, user: this._publicUser(u) };
  },

  async logout(){
    await sleep(40);
    DB.data.session = null;
    DB.save();
  },

  _publicUser(u){
    if(!u) return null;
    return {
      _id: u._id, name: u.name, email: u.email, phone: u.phone,
      referral_code: u.referral_code, kyc_verified: u.kyc_verified,
      created_at: u.created_at
    };
  },

  /* GET /api/awards/tiers (cached 1hr) */
  async getTiers(){
    const cached = sessionStorage.getItem('liq_tiers');
    if(cached){
      try{
        const p = JSON.parse(cached);
        if(now() - p.at < 3600000) return p.data;
      }catch(e){}
    }
    await this._wait();
    const data = DB.data.awardTiers.filter(t => t.is_active).sort((a,b)=>a.referrals_required-b.referrals_required);
    try{ sessionStorage.setItem('liq_tiers', JSON.stringify({ at: now(), data })); }catch(e){}
    return data;
  },

  /* GET /api/awards/status */
  async getStatus(userId){
    await this._wait();
    return computeEligibility(userId);
  },

  /* POST /api/awards/claim/:tierNumber */
  async claim(userId, tierNumber, deliveryDetails){
    await this._wait();
    const tier = DB.data.awardTiers.find(t => t.tier_number === Number(tierNumber));
    if(!tier) throw new Error('Tier not found.');

    const elig = computeEligibility(userId);
    if(elig.confirmed_referrals < tier.referrals_required){
      throw new Error(`You need ${tier.referrals_required} confirmed referrals to claim this tier.`);
    }
    if(DB.data.awardClaims.some(c => c.user === userId && c.tier_number === Number(tierNumber))){
      throw new Error('You have already claimed this tier.');
    }
    if(tier.tier_number >= 5){
      const u = this._user(userId);
      if(u && !u.kyc_verified) throw new Error('KYC verification is required for tiers 5 and above.');
    }

    // Rate limit: max 3 claims / hour
    const recent = DB.data.awardClaims.filter(c => c.user === userId && now() - c.created_at < 3600000);
    if(recent.length >= 3) throw new Error('Rate limit reached. Maximum 3 claims per hour.');

    const claim = {
      _id: uid('claim'),
      user: userId,
      tier: tier._id,
      tier_number: tier.tier_number,
      referrals_at_claim: elig.confirmed_referrals,
      status: 'claimed',
      delivery_details: deliveryDetails,
      admin_notes: '',
      reviewed_by: null,
      reviewed_at: null,
      fulfilled_at: null,
      tracking_info: null,
      rejection_reason: null,
      created_at: now(),
      updated_at: now()
    };
    DB.data.awardClaims.push(claim);
    DB.save();
    return claim;
  },

  /* GET /api/awards/claims */
  async getClaims(userId){
    await this._wait();
    return DB.data.awardClaims
      .filter(c => c.user === userId)
      .sort((a,b) => b.created_at - a.created_at);
  },

  /* GET /api/awards/leaderboard */
  async getLeaderboard(){
    await this._wait();
    const rows = DB.data.users
      .filter(u => u.referred_by === null || u._id === 'u_demo' || u._confirmed_override)
      .map(u => {
        const confirmed = u._confirmed_override != null
          ? u._confirmed_override
          : DB.data.referrals.filter(r => r.referrer_id === u._id && r.status === 'completed').length;
        return { userId: u._id, name: u.name, confirmed };
      })
      .filter(r => r.confirmed > 0)
      .sort((a,b) => b.confirmed - a.confirmed)
      .slice(0,100);

    return rows.map((r, i) => {
      const tier = tierForCount(r.confirmed);
      return { rank: i+1, ...r, tier };
    });
  },

  /* GET /api/notifications */
  async getNotifications(userId){
    return DB.data.notifications.filter(n => n.userId === userId).sort((a,b)=>b.at-a.at);
  },

  async markNotificationsRead(userId){
    DB.data.notifications.forEach(n => { if(n.userId === userId) n.read = true; });
    DB.save();
  },

  /* Admin */
  async adminGetClaims(){
    await this._wait();
    return DB.data.awardClaims
      .map(c => {
        const u = this._user(c.user);
        const t = DB.data.awardTiers.find(x => x.tier_number === c.tier_number);
        return { ...c, _user: u ? { name: u.name, email: u.email } : null, _tier: t || null };
      })
      .sort((a,b) => b.created_at - a.created_at);
  },

  async adminSetClaimStatus(claimId, status, extra){
    await this._wait();
    const c = DB.data.awardClaims.find(x => x._id === claimId);
    if(!c) throw new Error('Claim not found.');
    c.status = status;
    c.updated_at = now();
    c.reviewed_at = c.reviewed_at || now();
    if(status === 'fulfilled'){ c.fulfilled_at = now(); c.tracking_info = extra?.tracking_info || c.tracking_info; }
    if(status === 'rejected'){ c.rejection_reason = extra?.reason || 'Does not meet programme terms.'; }
    DB.save();
    return c;
  }
};

/* ==========================================================================
   4. ELIGIBILITY ENGINE
   ========================================================================== */
function tierForCount(count){
  let match = null;
  for(const t of TIER_SEED){
    if(count >= t.referrals_required) match = t;
    else break;
  }
  return match;
}

function computeEligibility(userId){
  const tiers = DB.data.awardTiers
    .filter(t => t.is_active)
    .sort((a,b)=>a.referrals_required - b.referrals_required);

  const confirmed = DB.data.referrals.filter(
    r => r.referrer_id === userId && r.status === 'completed'
  ).length;

  const claims = DB.data.awardClaims.filter(c => c.user === userId);
  const claimedSet = new Set(claims.map(c => c.tier_number));

  const unlocked = [];
  const claimable = [];
  let nextTier = null;

  for(const t of tiers){
    const reached = confirmed >= t.referrals_required;
    if(reached){
      unlocked.push(t.tier_number);
      if(!claimedSet.has(t.tier_number)){
        const existing = claims.find(c => c.tier_number === t.tier_number);
        if(!existing) claimable.push(t);
      }
    } else if(!nextTier){
      nextTier = {
        ...t,
        referrals_needed: t.referrals_required - confirmed,
        progress_percent: clamp((confirmed / t.referrals_required) * 100, 0, 100)
      };
    }
  }

  // ETA based on 30-day velocity
  let avg30 = 0;
  if(nextTier){
    const cutoff = now() - 30*DAY;
    const recent = DB.data.referrals.filter(
      r => r.referrer_id === userId && r.status === 'completed' && (r.confirmed_at||0) >= cutoff
    ).length;
    avg30 = recent / 30;
  }

  const u = DB.data.users.find(x => x._id === userId);

  return {
    confirmed_referrals: confirmed,
    total_referrals: u ? (u.referral_count || DB.data.referrals.filter(r=>r.referrer_id===userId).length) : 0,
    pending_referrals: DB.data.referrals.filter(r => r.referrer_id === userId && r.status !== 'completed').length,
    unlocked_tiers: unlocked,
    claimable_tiers: claimable,
    next_tier: nextTier,
    claims,
    referral_code: u ? u.referral_code : '',
    referral_link: u ? (location.origin + location.pathname + '?ref=' + u.referral_code) : '',
    avg_daily: avg30,
    eta_days: (nextTier && avg30 >= 0.5) ? Math.ceil(nextTier.referrals_needed / avg30) : null,
    rarity_percent: computeRarity(confirmed)
  };
}

function computeRarity(count){
  const all = DB.data.users
    .map(u => u._confirmed_override != null
      ? u._confirmed_override
      : DB.data.referrals.filter(r => r.referrer_id === u._id && r.status === 'completed').length)
    .filter(c => c > 0);
  if(!all.length) return 100;
  const below = all.filter(c => c < count).length;
  return clamp(100 - (below / all.length) * 100, 0.1, 99.9);
}

    if(!el || el._dismissed) return;

    clearTimeout(el._to);
    el.classList.add('out');
    setTimeout(() => el.remove(), 320);
  }
};

const Sheet = {

    host.innerHTML = `
      <div class="overlay" id="liqOverlay">
        <div class="sheet" role="dialog" aria-modal="true" aria-label="${escapeHtml(title||'Dialog')}">
          <div class="sheet-grabber"></div>
          ${title ? `<h3 class="h5 mb-3" style="font-size:1.05rem">${escapeHtml(title)}</h3>` : ''}
          <div class="sheet-body">${body||''}</div>
          ${actions.length ? `<div class="d-flex gap-2 mt-4 flex-wrap">${actions.map(a =>
            `<button class="btn-liq ${a.class||'btn-ghost'} ${a.block===false?'':'flex-grow-1'}" data-act="${a.id}">${a.label}</button>`
          ).join('')}</div>` : ''}
        </div>
      </div>
    `;
    const ov = $('#liqOverlay');
    requestAnimationFrame(() => ov.classList.add('open'));

    const close = () => {
      ov.classList.remove('open');
      setTimeout(() => { host.innerHTML = ''; }, 340);
    };

    ov.addEventListener('click', e => { if(e.target === ov) close(); });
    actions.forEach(a => {
      const btn = ov.querySelector(`[data-act="${a.id}"]`);
      if(btn) btn.onclick = () => { if(a.onClick) a.onClick(close); else close(); };
    });
    if(onMount) onMount(ov, close);
    return close;
  },
  close(){
    const ov = $('#liqOverlay');
    if(!ov) return;
    ov.classList.remove('open');
    setTimeout(() => { $('#sheetHost').innerHTML=''; }, 340);
  }
};

/* ==========================================================================
   8. CONFETTI ENGINE (~3kb canvas)
   ========================================================================== */
const Confetti = (() => {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let raf = null;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  const COLORS = ['#d4af37','#f6d054','#10b981','#34d399','#fbf8f0','#a8861f','#059669'];

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  resize();
  addEventListener('resize', resize, { passive:true });

  function spawn(x, y, count){
    if(prefersReducedMotion()) return;
    for(let i=0;i<count;i++){
      const angle = Math.random() * Math.PI * 2;
      const speed = 3 + Math.random() * 8;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 4,
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 9,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.34,
        color: COLORS[(Math.random()*COLORS.length)|0],
        life: 1,
        decay: 0.008 + Math.random() * 0.009,
        shape: Math.random() > 0.72 ? 'circle' : 'rect'
      });
    }
    if(!raf) raf = requestAnimationFrame(tick);
  }

  function tick(){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for(let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.vy += 0.28;
      p.vx *= 0.992;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;

      if(p.life <= 0 || p.y > innerHeight + 60){
        particles.splice(i,1);
        continue;
      }

      ctx.save();
      ctx.globalAlpha = clamp(p.life, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if(p.shape === 'circle'){
        ctx.beginPath();
        ctx.arc(0, 0, p.w/2, 0, Math.PI*2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      }
      ctx.restore();
    }
    if(particles.length){ raf = requestAnimationFrame(tick); }
    else { ctx.clearRect(0,0,innerWidth,innerHeight); raf = null; }
  }

  return {
    burst(x = innerWidth/2, y = innerHeight/2, count = 80){ spawn(x, y, count); },
    celebrate(){
      spawn(innerWidth*0.5, innerHeight*0.34, 70);
      setTimeout(() => spawn(innerWidth*0.24, innerHeight*0.44, 44), 140);
      setTimeout(() => spawn(innerWidth*0.76, innerHeight*0.44, 44), 250);
    },
    stop(){ particles = []; ctx.clearRect(0,0,innerWidth,innerHeight); }
  };
})();

function progressRing(percent, size = 148, stroke = 10, color = 'var(--gold-500)', label){
  const r = (size - stroke) / 2;

  const off = c * (1 - clamp(percent,0,100) / 100);
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.075)" stroke-width="${stroke}" fill="none"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}"
      stroke="${color}" stroke-width="${stroke}" fill="none" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${c.toFixed(2)}"
      data-target="${off.toFixed(2)}"
      transform="rotate(-90 ${size/2} ${size/2})"
      style="filter:drop-shadow(0 0 8px ${color})"/>
    <text x="50%" y="50%" text-anchor="middle" dy="0.36em" class="ring-label">${label != null ? label : Math.round(percent)+'%'}</text>

/* Animate bars + rings after render */
function animateProgress(root = document){
  requestAnimationFrame(() => {
    $$('.bar-fill[data-pct]', root).forEach(el => {
      const p = parseFloat(el.dataset.pct) || 0;
      el.style.width = p + '%';
    });
    $$('.ring-fg[data-target]', root).forEach(el => {
      setTimeout(() => { el.setAttribute('stroke-dashoffset', el.dataset.target); }, 90);
    });
  });
}

/* Scroll reveal */
let revealObserver = null;
function initReveal(root = document){
  if(prefersReducedMotion()){
    $$('.reveal', root).forEach(el => el.classList.add('in'));
    return;
  }
  if(!revealObserver){
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if(e.isIntersecting){
          e.target.classList.add('in');
          revealObserver.unobserve(e.target);
        }
      });
    }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
  }
  $$('.reveal:not(.in)', root).forEach(el => revealObserver.observe(el));
}

function staggerChildren(container, delay = 80){
  if(prefersReducedMotion()) return;
  const kids = Array.from(container.children);
  kids.forEach((k, i) => {
    k.style.animationDelay = (i * delay) + 'ms';
  });
}

/* Count-up animation for stat values */
function countUp(el, to, duration = 900, format = fmtNum){
  if(prefersReducedMotion()){ el.textContent = format(to); return; }
  const from = 0;
  const start = performance.now();
  function frame(t){
    const p = clamp((t - start) / duration, 0, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = format(Math.round(from + (to - from) * eased));
    if(p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ==========================================================================
   11. AUTOMATION SCRIPTS + TOOLS

const Automation = {
  log: [],
  timers: [],

  record(name, status, msg){
    this.log.unshift({ name, status, msg, at: now() });
    this.log = this.log.slice(0, 60);
    DB.data.meta.automation_runs = (DB.data.meta.automation_runs || 0) + 1;
    DB.save();
    this.renderLog();
  },

  renderLog(){
    const el = document.getElementById('autoLogEl');
    if(!el) return;
    el.innerHTML = this.log.length
      ? this.log.map(l => `<div><span class="${l.status==='ok'?'ok':l.status==='warn'?'wn':'er'}">[${l.status.toUpperCase()}]</span> ${escapeHtml(l.name)} — ${escapeHtml(l.msg)}</div>`).join('')
      : '<div class="t-lo">No automation runs yet.</div>';
  },

  /* --- seed-award-tiers.js --------------------------------------------- */
  seedAwardTiers(){
    const existing = new Set(DB.data.awardTiers.map(t => t.tier_number));
    let added = 0;
    TIER_SEED.forEach((t,i) => {
      if(!existing.has(t.tier_number)){
        DB.data.awardTiers.push({ _id:'tier_'+t.tier_number, ...t, is_active:true, display_order:i, created_at:now(), updated_at:now() });
        added++;
      }
    });
    DB.save();
    this.record('seed-award-tiers.js', added ? 'ok' : 'warn', added ? `${added} tier(s) inserted.` : 'All 12 tiers already present.');
    return added;
  },

  /* --- refresh-leaderboard.js ------------------------------------------- */
  refreshLeaderboard(){
    DB.data.meta.leaderboard_updated_at = now();
    DB.save();
    sessionStorage.removeItem('liq_lb_cache');
    this.record('refresh-leaderboard.js', 'ok', 'Leaderboard cache recomputed.');
  },

  /* --- notify-unclaimed-awards.js --------------------------------------- */
  notifyUnclaimedAwards(){
    let sent = 0;
    DB.data.users.forEach(u => {
      const elig = computeEligibility(u._id);
      if(elig.claimable_tiers.length){
        const already = DB.data.notifications.some(
          n => n.userId === u._id && n.title === 'Unclaimed award available' && now() - n.at < 7*DAY
        );
        if(!already){
          this.pushNotification(u._id, 'Unclaimed award available',
            `You have ${elig.claimable_tiers.length} unclaimed award(s). Claim before they pile up!`);
          sent++;
        }
      }
    });
    this.record('notify-unclaimed-awards.js', sent ? 'ok' : 'warn',
      sent ? `${sent} notification(s) dispatched.` : 'No unclaimed awards detected.');
    return sent;
  },

  pushNotification(userId, title, body){
    DB.data.notifications.unshift({ id: uid('n'), userId, title, body, read:false, at: now() });
    DB.save();
  },

  /* --- backup-claims.js -------------------------------------------------- */
  backupClaims(){
    const rows = [['claim_id','user_email','tier_number','status','created_at','fulfilled_at','tracking']];
    DB.data.awardClaims.forEach(c => {
      const u = DB.data.users.find(x => x._id === c.user);
      rows.push([c._id, u?u.email:'', c.tier_number, c.status,
        new Date(c.created_at).toISOString(),
        c.fulfilled_at ? new Date(c.fulfilled_at).toISOString() : '',
        c.tracking_info || '']);
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    try{
      const blob = new Blob([csv], { type:'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'liquidated-claims-' + new Date().toISOString().slice(0,10) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      this.record('backup-claims.js', 'ok', `${DB.data.awardClaims.length} claim(s) exported to CSV.`);
    }catch(e){
      this.record('backup-claims.js', 'er', 'Export failed: ' + e.message);
    }
  },

  /* --- eligibility-scan.js (tier unlock detection) ---------------------- */
  eligibilityScan(){
    if(!AuthStore.user){ this.record('eligibility-scan.js','warn','No authenticated user.'); return; }
    const elig = computeEligibility(AuthStore.user._id);
    const seenKey = 'liq_seen_unlocks_' + AuthStore.user._id;
    let seen = [];
    try{ seen = JSON.parse(localStorage.getItem(seenKey) || '[]'); }catch(e){}

    const fresh = elig.unlocked_tiers.filter(t => !seen.includes(t));
    if(fresh.length){
      const tier = DB.data.awardTiers.find(t => t.tier_number === fresh[fresh.length-1]);
      Confetti.celebrate();
      vibrate([28, 60, 28]);
      Toast.show(`🎉 Tier unlocked: ${tier.title}! ${tier.reward_name}`, 'gold', 6000);
      Notify.push(AuthStore.user._id, 'Tier unlocked', `${tier.title} is now available to claim.`);
      localStorage.setItem(seenKey, JSON.stringify(elig.unlocked_tiers));
      this.record('eligibility-scan.js', 'ok', `New unlock detected: ${tier.title}.`);
    } else {
      this.record('eligibility-scan.js', 'ok', `${elig.confirmed_referrals} confirmed · ${elig.claimable_tiers.length} claimable.`);
    }
    return fresh;
  },

  /* --- perf-audit.js ----------------------------------------------------- */
  perfAudit(){
    const nav = performance.getEntriesByType('navigation')[0];
    if(!nav){ this.record('perf-audit.js','warn','Navigation timing unavailable.'); return; }
    const dcl = Math.round(nav.domContentLoadedEventEnd);
    const load = Math.round(nav.loadEventEnd || nav.domContentLoadedEventEnd);
    const paint = performance.getEntriesByType('paint').find(p => p.name === 'first-contentful-paint');
    const fcp = paint ? Math.round(paint.startTime) : '—';
    this.record('perf-audit.js', load < 2500 ? 'ok' : 'warn',
      `FCP ${fcp}ms · DCL ${dcl}ms · Load ${load}ms`);
  },

  /* --- Schedulers --------------------------------------------------------- */
  startSchedulers(){
    // Refresh leaderboard hourly
    this.timers.push(setInterval(() => this.refreshLeaderboard(), 3600000));
    // Eligibility scan every 60s while tab visible
    this.timers.push(setInterval(() => {
      if(document.visibilityState === 'visible' && AuthStore.isAuthed) this.eligibilityScan();
    }, 60000));
    // Idle perf audit
    if('requestIdleCallback' in window){
      requestIdleCallback(() => this.perfAudit(), { timeout: 3000 });
    } else {
      setTimeout(() => this.perfAudit(), 2200);
    }
  },

  openConsole(){
    const rows = [
      ['seedAwardTiers', 'seed-award-tiers.js', 'Insert any missing tier definitions into the store.'],
      ['refreshLeaderboard', 'refresh-leaderboard.js', 'Recompute the leaderboard cache immediately.'],
      ['notifyUnclaimedAwards', 'notify-unclaimed-awards.js', 'Email/in-app notify users with unclaimed tiers.'],
      ['backupClaims', 'backup-claims.js', 'Export all award claims to CSV.'],
      ['eligibilityScan', 'eligibility-scan.js', 'Re-evaluate tier unlocks for the current user.'],
      ['perfAudit', 'perf-audit.js', 'Run a runtime performance audit.'],
      ['resetDatabase', 'reset-database.js', 'Wipe local data and re-seed from scratch.']
    ];
    Sheet.open({
      title: '⚙️ Automation Console',
      body: `
        <p class="fs-7 t-mid mb-3">
          Scheduled and on-demand scripts mirroring the backend cron jobs.
          Runs: <span class="mono t-gold">${DB.data.meta.automation_runs || 0}</span>
        </p>
        <div class="d-grid gap-2 mb-3">
          ${rows.map(([fn, name, desc]) => `
            <button class="btn-liq btn-ghost w-100 justify-content-start text-start" data-auto="${fn}" style="padding:.62rem .8rem">
              <div style="flex:1">
                <div class="mono fs-8 t-gold">${name}</div>
                <div class="fs-9 t-lo" style="font-weight:400">${desc}</div>
              </div>
              <i class="bi bi-play-fill"></i>
            </button>
          `).join('')}
        </div>
        <div class="eyebrow mb-2">Run Log</div>
        <div class="auto-log" id="autoLogEl"></div>
      `,
      actions: [
        { id:'close', label:'Close', class:'btn-ghost' }
      ],
      onMount(ov, close){
        Automation.renderLog();
        ov.querySelectorAll('[data-auto]').forEach(btn => {
          btn.onclick = () => {
            const fn = btn.dataset.auto;
            vibrate(12);
            if(fn === 'resetDatabase'){
              Sheet.open({
                title: 'Reset local database?',
                body: '<p class="t-mid fs-7">This wipes all locally stored users, referrals, tiers and claims, then re-seeds the demo dataset. You will be signed out.</p>',
                actions: [
                  { id:'cancel', label:'Cancel', class:'btn-ghost' },
                  { id:'confirm', label:'Reset everything', class:'', onClick(c){
                    DB.reset();
                    AuthStore.hydrate();
                    Automation.record('reset-database.js','ok','Local database reset and re-seeded.');
                    c(); Sheet.close();
                    Toast.show('Database reset complete.', 'success');
                    setTimeout(() => location.reload(), 700);
                  }}
                ]
              });
              return;
            }
            try{
              Automation[fn]();
              Toast.show(fn + ' executed.', 'success', 2600);
              setTimeout(() => Automation.renderLog(), 60);
            }catch(e){
              Automation.record(fn, 'er', e.message);
              Toast.show('Script error: ' + e.message, 'error');
            }
          };
        });
      }
    });
  }
};

const LoginView = {
  render(){
    return `
    <div class="view-enter d-flex align-items-center justify-content-center" style="min-height:calc(100dvh - 140px)">

          <p class="t-mid fs-7 mb-0">Sign in to track your referral awards.</p>
        </div>

        <div class="surface surface-pad">
          <form id="loginForm" novalidate>
            <div class="mb-3">
              <label class="form-label-liq" for="lgEmail">Email Address</label>
              <input type="email" class="input-liq" id="lgEmail" placeholder="you@example.com"
                     autocomplete="email" inputmode="email" value="ada@liquidated.com" required />
              <div class="field-error" id="err-lgEmail"></div>
            </div>
            <div class="mb-3">
              <label class="form-label-liq" for="lgPass">Password</label>
              <div style="position:relative">
                <input type="password" class="input-liq" id="lgPass" placeholder="••••••••"
                       autocomplete="current-password" value="demo1234" required style="padding-right:46px" />
                <button type="button" class="icon-btn" id="togglePass"
                        style="position:absolute;right:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;background:none;border:0">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="field-error" id="err-lgPass"></div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <label class="d-flex align-items-center gap-2 fs-8 t-mid" style="cursor:pointer">
                <input type="checkbox" checked style="accent-color:var(--gold-500)" /> Remember me
              </label>
              <a href="#/support" class="fs-8">Forgot password?</a>
            </div>

            <button type="submit" class="btn-liq btn-block" id="lgSubmit">
              <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
          </form>

          <div class="divider"></div>

          <div class="text-center">
            <p class="fs-8 t-lo mb-2">Demo credentials are pre-filled.</p>
            <p class="fs-8 t-mid mb-0">
              New to Liquidated? <a href="#/">Learn about the programme</a>
            </p>
          </div>
        </div>

        <div class="text-center mt-3">
          <a href="#/" class="fs-8 t-lo"><i class="bi bi-arrow-left me-1"></i>Back to home</a>
        </div>
      </div>
    </div>
    `;
  },

  mount(){
    const form = $('#loginForm');
    const toggle = $('#togglePass');
    if(toggle){
      toggle.onclick = () => {
        const inp = $('#lgPass');
        const isPw = inp.type === 'password';
        inp.type = isPw ? 'text' : 'password';
        toggle.innerHTML = `<i class="bi bi-eye${isPw?'-slash':''}"></i>`;
      };
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const email = $('#lgEmail').value.trim();
      const pass  = $('#lgPass').value;
      let ok = true;

      $$('.field-error').forEach(el => el.classList.remove('show'));
      $$('.input-liq').forEach(el => el.classList.remove('is-invalid'));

      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        showErr('lgEmail', 'Please enter a valid email address.'); ok = false;
      }
      if(!pass){ showErr('lgPass', 'Password is required.'); ok = false; }
      if(!ok) return;

      const btn = $('#lgSubmit');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing in…';

      try{
        await AuthStore.login(email, pass);
        vibrate(14);
        Toast.show('Welcome back, ' + AuthStore.user.name.split(' ')[0] + '!', 'success');
        renderTopBar(); renderDock();
        Router.go('/dashboard');
      }catch(err){
        Toast.show(err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In';
      }
    };
  }
};

function showErr(id, msg){
  const input = document.getElementById(id);
  const err = document.getElementById('err-' + id);
  if(input) input.classList.add('is-invalid');
  if(err){ err.textContent = msg; err.classList.add('show'); }
}

function greeting(){
  const h = new Date().getHours();
  if(h < 12) return 'Good morning';
  if(h < 17) return 'Good afternoon';
  return 'Good evening';
}

/* ---------------------------------------------------------------------------

--------------------------------------------------------------------------- */
const AwardsView = {
  render(){
    const user = AuthStore.user;
    const s = computeEligibility(user._id);
    const filter = UIStore.awardsFilter;
    const view = UIStore.awardsView;

    const filtered = TIER_SEED.filter(t => {
      const unlocked = s.unlocked_tiers.includes(t.tier_number);
      if(filter === 'unlocked') return unlocked;
      if(filter === 'locked') return !unlocked;
      if(filter === 'claimable') return s.claimable_tiers.some(c => c.tier_number === t.tier_number);
      return true;
    });

    return `
    <div class="view-enter">
      <div class="d-flex justify-content-between align-items-start mb-3 flex-wrap gap-2">
        <div>
          <div class="eyebrow mb-1">The Ladder</div>
          <h1 class="section-title mb-1">Awards &amp; Tiers</h1>
          <p class="t-mid fs-7 mb-0">
            <span class="t-gold mono">${s.confirmed_referrals}</span> confirmed ·
            <span class="t-emerald mono">${s.unlocked_tiers.length}</span> unlocked ·
            ${s.claimable_tiers.length ? `<span class="t-gold mono">${s.claimable_tiers.length}</span> claimable` : 'nothing claimable yet'}
          </p>
        </div>
        <button class="btn-liq btn-ghost btn-sm-liq nowrap" id="toggleView">
          <i class="bi bi-${view === 'ladder' ? 'grid-3x3-gap' : 'list-ul'}"></i>
          ${view === 'ladder' ? 'Grid' : 'Ladder'}
        </button>
      </div>

      <div class="filter-tabs mb-3">
        ${[
          ['all','All 12'],
          ['unlocked','Unlocked'],
          ['claimable','Claimable'],
          ['locked','Locked']
        ].map(([key,label]) => `
          <button class="filter-tab ${filter===key?'active':''}" data-filter="${key}">${label}</button>
        `).join('')}
      </div>

      ${view === 'ladder' ? this.renderLadder(filtered, s) : this.renderGrid(filtered, s)}

      <div class="divider"></div>
      <p class="fs-9 t-lo text-center mw-640 mx-auto mb-4">
        Only confirmed investors count toward your ladder. Referrals are subject to verification, rate limits,
        and the programme's published terms.
      </p>
    </div>
    `;
  },

  renderLadder(tiers, s){
    const maxUnlocked = s.unlocked_tiers.length;
    const railHeight = Math.min(100, (maxUnlocked / TIER_SEED.length) * 100);

    return `
    <div class="ladder" id="ladderEl">
      <div class="ladder-rail"></div>
      <div class="ladder-rail-fill" id="railFill" style="height:0"></div>
      ${tiers.map(t => {
        const unlocked = s.unlocked_tiers.includes(t.tier_number);
        const claimable = s.claimable_tiers.some(c => c.tier_number === t.tier_number);
        const claim = s.claims.find(c => c.tier_number === t.tier_number);
        const isCurrent = s.next_tier && s.next_tier.tier_number === t.tier_number;
        const pct = clamp((s.confirmed_referrals / t.referrals_required) * 100, 0, 100);

        let cls = 'tier-card';
        if(unlocked) cls += ' unlocked';
        if(!unlocked && !isCurrent) cls += ' locked';
        if(claimable) cls += ' claimable';

        return `
        <div class="ladder-node ${unlocked?'unlocked':''} ${isCurrent?'current':''} ${!unlocked&&!isCurrent?'locked':''}"
             data-node="${t.tier_number}">
          <div class="ladder-dot">
            ${unlocked ? '<i class="bi bi-check-lg t-gold"></i>' : isCurrent ? '<i class="bi bi-record-circle t-emerald"></i>' : '<i class="bi bi-lock-fill"></i>'}
          </div>
          <div class="${cls}" style="--accent:${t.accent_color}" data-tier-card="${t.tier_number}">
            ${claimable ? '<div class="ribbon">CLAIM</div>' : ''}
            <div class="d-flex align-items-start gap-3">
              ${tierShield(t, 52, unlocked)}
              <div style="flex:1;min-width:0">
                <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
                  <span class="fs-9 t-lo mono">TIER ${t.tier_number}</span>
                  ${unlocked ? '<span class="pill pill-emerald">Unlocked</span>' : isCurrent ? '<span class="pill pill-gold">In Progress</span>' : '<span class="pill pill-muted">Locked</span>'}
                  ${claim ? statusPill(claim.status) : ''}
                </div>
                <div class="fw-bold" style="font-size:.98rem">${escapeHtml(t.title)}</div>
                <div class="fs-8 t-mid mb-2">${escapeHtml(t.reward_name)}</div>

                ${!unlocked && isCurrent ? `
                  ${bar(pct)}
                  <div class="d-flex justify-content-between fs-9 t-lo mono mt-1">
                    <span>${s.confirmed_referrals} / ${t.referrals_required}</span>
                    <span>${(t.referrals_required - s.confirmed_referrals)} to go</span>
                  </div>
                ` : ''}
                ${!unlocked && !isCurrent ? `
                  <div class="fs-9 t-lo">
                    <i class="bi bi-lock me-1"></i>${t.referrals_required - s.confirmed_referrals} more to unlock
                  </div>
                ` : ''}
                ${unlocked ? `
                  <div class="d-flex gap-2 flex-wrap mt-2">
                    ${claimable ? `<button class="btn-liq btn-xs-liq" data-claim="${t.tier_number}"><i class="bi bi-gift"></i> Claim Now</button>` : ''}
                    <button class="btn-liq btn-ghost btn-xs-liq" data-detail="${t.slug}">Details</button>
                  </div>
                ` : ''}
              </div>
              <div class="text-end flex-shrink-0">
                <div class="fs-9 t-lo mono">${t.referrals_required}</div>
                <div class="fs-9 t-lo" style="font-size:.55rem">REFS</div>
              </div>
            </div>
          </div>
        </div>
        `;
      }).join('')}
    </div>
    `;
  },

  renderGrid(tiers, s){
    return `
    <div class="tier-grid">
      ${tiers.map(t => {
        const unlocked = s.unlocked_tiers.includes(t.tier_number);
        const claimable = s.claimable_tiers.some(c => c.tier_number === t.tier_number);
        const claim = s.claims.find(c => c.tier_number === t.tier_number);
        const isCurrent = s.next_tier && s.next_tier.tier_number === t.tier_number;
        const pct = clamp((s.confirmed_referrals / t.referrals_required) * 100, 0, 100);

        return `
        <div class="tier-card ${unlocked?'':'locked'} ${claimable?'claimable':''}"
             style="--accent:${t.accent_color}" data-tier-card="${t.tier_number}">
          ${claimable ? '<div class="ribbon">CLAIM</div>' : ''}
          <div class="text-center mb-2">${tierShield(t, 64, unlocked)}</div>
          <div class="text-center mb-2">
            <div class="fs-9 t-lo mono">TIER ${t.tier_number}</div>
            <div class="fw-bold">${escapeHtml(t.title)}</div>
          </div>
          <div class="fs-8 t-mid text-center mb-3" style="min-height:38px">${escapeHtml(t.reward_name)}</div>

          ${isCurrent ? bar(pct, 'mb-2') : ''}

          <div class="d-flex justify-content-center gap-2 flex-wrap mb-3">
            <span class="pill pill-gold mono">${t.referrals_required} refs</span>
            ${unlocked ? '<span class="pill pill-emerald">Unlocked</span>' : ''}
            ${claim ? statusPill(claim.status) : ''}
          </div>

          <div class="d-flex gap-2">
            ${claimable
              ? `<button class="btn-liq btn-sm-liq flex-grow-1" data-claim="${t.tier_number}"><i class="bi bi-gift"></i> Claim</button>`
              : `<button class="btn-liq btn-ghost btn-sm-liq flex-grow-1" data-detail="${t.slug}">View</button>`}
          </div>
        </div>
        `;
      }).join('')}
    </div>
    `;
  },

  mount(){
    animateProgress();

    // Rail fill
    const rail = $('#railFill');
    if(rail){
      const s = computeEligibility(AuthStore.user._id);
      const pct = (s.unlocked_tiers.length / TIER_SEED.length) * 100;
      setTimeout(() => { rail.style.height = pct + '%'; }, 200);
    }

    // Toggle view
    const tv = $('#toggleView');
    if(tv) tv.onclick = () => {
      UIStore.awardsView = UIStore.awardsView === 'ladder' ? 'grid' : 'ladder';
      localStorage.setItem('liq_awards_view', UIStore.awardsView);
      Router.rerender();
    };

    // Filters
    $$('[data-filter]').forEach(b => {
      b.onclick = () => {
        UIStore.awardsFilter = b.dataset.filter;
        Router.rerender();
      };
    });

    // Claim buttons
    $$('[data-claim]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        vibrate(16);
        Router.go('/claim/' + b.dataset.claim);
      };
    });

    // Detail buttons
    $$('[data-detail]').forEach(b => {
      b.onclick = (e) => {
        e.stopPropagation();
        Router.go('/awards/' + b.dataset.detail);
      };
    });

    // Card taps
    $$('[data-tier-card]').forEach(card => {
      card.addEventListener('click', (e) => {
        if(e.target.closest('button')) return;
        const tierNum = Number(card.dataset.tierCard);
        const tier = TIER_SEED.find(t => t.tier_number === tierNum);
        const s = computeEligibility(AuthStore.user._id);
        if(!s.unlocked_tiers.includes(tierNum)){
          card.classList.add('shake');
          setTimeout(() => card.classList.remove('shake'), 460);
          vibrate([20,40,20]);
          const need = tier.referrals_required - s.confirmed_referrals;
          Toast.show(`🔒 ${tier.title} needs ${need} more confirmed referral${need>1?'s':''}.`, 'info', 3000);
          return;
        }
        Router.go('/awards/' + tier.slug);
      });
    });
  }
};
