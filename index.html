const ClaimView = {
  state: { step: 1, data: {} },

  render(params){
    const tierNum = Number(params.tierNumber);
    const tier = TIER_SEED.find(t => t.tier_number === tierNum);
    if(!tier){
      return `<div class="view-enter text-center py-5"><h1>Tier not found</h1><a href="#/awards" class="btn-liq mt-3">Back</a></div>`;
    }

    const s = computeEligibility(AuthStore.user._id);
    if(!s.unlocked_tiers.includes(tierNum)){
      return `<div class="view-enter text-center py-5">
        <div style="font-size:3rem">🔒</div>
        <h1 class="section-title mt-3 mb-2">Not yet unlocked</h1>
        <p class="t-mid fs-8">You need ${tier.referrals_required - s.confirmed_referrals} more confirmed referrals for ${escapeHtml(tier.title)}.</p>
        <a href="#/awards" class="btn-liq mt-3">Back to Ladder</a>
      </div>`;
    }
    if(s.claims.some(c => c.tier_number === tierNum)){
      return `<div class="view-enter text-center py-5">
        <div style="font-size:3rem">✅</div>
        <h1 class="section-title mt-3 mb-2">Already claimed</h1>
        <p class="t-mid fs-8">You've already submitted a claim for ${escapeHtml(tier.title)}.</p>
        <a href="#/claims" class="btn-liq mt-3">View Claim Status</a>
      </div>`;
    }

    this.state = { step: 1, data: { full_name: AuthStore.user.name, email: AuthStore.user.email, phone: AuthStore.user.phone || '', country: 'Nigeria' } };

    return `
    <div class="view-enter mw-640 mx-auto">
      <button class="btn-liq btn-ghost btn-xs-liq mb-3" onclick="location.hash='#/awards'">
        <i class="bi bi-arrow-left"></i> Cancel
      </button>

      <div class="text-center mb-4">
        ${tierShield(tier, 72, true)}
        <h1 class="section-title mt-3 mb-1">Claim ${escapeHtml(tier.title)}</h1>
        <p class="t-mid fs-8 mb-0">${escapeHtml(tier.reward_name)}</p>
      </div>

      <div class="steps" id="claimSteps">
        <div class="s active"></div><div class="s"></div><div class="s"></div><div class="s"></div>
      </div>

      <div class="surface surface-pad" id="claimBody"></div>
    </div>
    `;
  },

  mount(params){
    this.params = params;
    this.renderStep(1);
  },

  setStep(n){
    this.state.step = n;
    const steps = $$('#claimSteps .s');
    steps.forEach((el,i) => {
      el.classList.remove('active','done');
      if(i < n-1) el.classList.add('done');
      if(i === n-1) el.classList.add('active');
    });
    this.renderStep(n);
  },

  renderStep(n){
    const tierNum = Number(this.params.tierNumber);
    const tier = TIER_SEED.find(t => t.tier_number === tierNum);
    const body = $('#claimBody');
    const d = this.state.data;

    if(n === 1){
      body.innerHTML = `
        <div class="eyebrow mb-3">Step 1 of 4 · Confirm</div>
        <div class="d-flex align-items-center gap-3 mb-3 p-3" style="background:rgba(0,0,0,.24);border-radius:var(--r2)">
          ${tierShield(tier, 48)}
          <div style="flex:1">
            <div class="fw-bold">${escapeHtml(tier.title)}</div>
            <div class="fs-8 t-mid">${escapeHtml(tier.reward_name)}</div>
            <div class="fs-9 t-lo mt-1">${tier.estimated_value_ngn ? 'Est. value ' + fmtNaira(tier.estimated_value_ngn) : 'By invitation'}</div>
          </div>
        </div>
        <label class="d-flex gap-2 align-items-start mb-3 fs-8 t-mid" style="cursor:pointer">
          <input type="checkbox" id="agreeTerms" style="margin-top:3px;accent-color:var(--gold-500)" />
          <span>I confirm my referral activity is genuine and I accept the programme terms for this tier.
          I understand false claims may result in forfeiture of all awards.</span>
        </label>
        <button class="btn-liq btn-block" id="nextBtn" disabled>Continue <i class="bi bi-arrow-right"></i></button>
      `;
      const cb = $('#agreeTerms');
      const nb = $('#nextBtn');
      cb.onchange = () => { nb.disabled = !cb.checked; };
    }

    else if(n === 2){
      body.innerHTML = `
        <div class="eyebrow mb-3">Step 2 of 4 · Delivery Details</div>
        <form id="deliveryForm" novalidate>
          <div class="mb-3">
            <label class="form-label-liq" for="dFullName">Full Name *</label>
            <input class="input-liq" id="dFullName" value="${escapeHtml(d.full_name||'')}" required autocomplete="name" />
            <div class="field-error" id="err-dFullName"></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12 col-sm-6">
              <label class="form-label-liq" for="dPhone">Phone *</label>
              <input class="input-liq" id="dPhone" type="tel" inputmode="tel" value="${escapeHtml(d.phone||'')}"
                     placeholder="+2348012345678" required autocomplete="tel" />
              <div class="field-error" id="err-dPhone"></div>
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label-liq" for="dEmail">Email *</label>
              <input class="input-liq" id="dEmail" type="email" inputmode="email" value="${escapeHtml(d.email||'')}" required autocomplete="email" />
              <div class="field-error" id="err-dEmail"></div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label-liq" for="dAddress">Address Line *</label>
            <input class="input-liq" id="dAddress" value="${escapeHtml(d.address_line||'')}"
                   placeholder="Street, building, apartment" required autocomplete="street-address" />
            <div class="field-error" id="err-dAddress"></div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label-liq" for="dCity">City *</label>
              <input class="input-liq" id="dCity" value="${escapeHtml(d.city||'')}" required autocomplete="address-level2" />
              <div class="field-error" id="err-dCity"></div>
            </div>
            <div class="col-6">
              <label class="form-label-liq" for="dState">State *</label>
              <input class="input-liq" id="dState" value="${escapeHtml(d.state||'')}" required autocomplete="address-level1" />
              <div class="field-error" id="err-dState"></div>
            </div>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label-liq" for="dCountry">Country</label>
              <input class="input-liq" id="dCountry" value="${escapeHtml(d.country||'Nigeria')}" autocomplete="country-name" />
            </div>
            <div class="col-6">
              <label class="form-label-liq" for="dPostal">Postal Code</label>
              <input class="input-liq" id="dPostal" value="${escapeHtml(d.postal_code||'')}" inputmode="numeric" autocomplete="postal-code" />
            </div>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn-liq btn-ghost" id="backBtn"><i class="bi bi-arrow-left"></i></button>
            <button type="submit" class="btn-liq flex-grow-1">Continue <i class="bi bi-arrow-right"></i></button>
          </div>
        </form>
      `;

      $('#backBtn').onclick = () => this.setStep(1);
      $('#deliveryForm').onsubmit = (e) => {
        e.preventDefault();
        let ok = true;
        $$('.field-error').forEach(el => el.classList.remove('show'));
        $$('.input-liq').forEach(el => el.classList.remove('is-invalid'));

        const full_name = $('#dFullName').value.trim();
        const phone = $('#dPhone').value.trim();
        const email = $('#dEmail').value.trim();
        const address_line = $('#dAddress').value.trim();
        const city = $('#dCity').value.trim();
        const state = $('#dState').value.trim();
        const country = $('#dCountry').value.trim() || 'Nigeria';
        const postal_code = $('#dPostal').value.trim();

        if(full_name.length < 3){ showErr('dFullName','Please enter your full name.'); ok = false; }
        if(!/^(\+234|0)[789][01]\d{8}$/.test(phone.replace(/[\s-]/g,''))){ showErr('dPhone','Enter a valid Nigerian phone number.'); ok = false; }
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showErr('dEmail','Enter a valid email address.'); ok = false; }
        if(address_line.length < 10){ showErr('dAddress','Address must be at least 10 characters.'); ok = false; }
        if(!city){ showErr('dCity','City is required.'); ok = false; }
        if(!state){ showErr('dState','State is required.'); ok = false; }

        if(!ok){ vibrate([20,40,20]); return; }

        this.state.data = { full_name, phone, email, address_line, city, state, country, postal_code };
        this.setStep(3);
      };
    }

    else if(n === 3){
      body.innerHTML = `
        <div class="eyebrow mb-3">Step 3 of 4 · Review</div>
        <div class="mb-3 p-3" style="background:rgba(0,0,0,.24);border-radius:var(--r2)">
          <div class="fs-9 t-lo mono mb-2">REWARD</div>
          <div class="fw-bold mb-1">${escapeHtml(tier.title)}</div>
          <div class="fs-8 t-mid mb-2">${escapeHtml(tier.reward_name)}</div>
          <div class="fs-9 t-lo">Referrals at claim: <span class="mono t-gold">${computeEligibility(AuthStore.user._id).confirmed_referrals}</span></div>
        </div>
        <div class="mb-3 p-3" style="background:rgba(0,0,0,.24);border-radius:var(--r2)">
          <div class="fs-9 t-lo mono mb-2">DELIVER TO</div>
          <div class="fs-8 t-hi">${escapeHtml(d.full_name)}</div>
          <div class="fs-8 t-mid">${escapeHtml(d.address_line)}</div>
          <div class="fs-8 t-mid">${escapeHtml(d.city)}, ${escapeHtml(d.state)}</div>
          <div class="fs-8 t-mid">${escapeHtml(d.country)} ${escapeHtml(d.postal_code||'')}</div>
          <div class="fs-8 t-lo mt-2">${escapeHtml(d.phone)} · ${escapeHtml(d.email)}</div>
        </div>
        <div class="p-3 mb-3" style="background:rgba(16,185,129,.08);border-radius:var(--r2);border:1px solid rgba(16,185,129,.2)">
          <div class="fs-8 t-mid">
            <i class="bi bi-info-circle t-emerald me-1"></i>
            Review typically takes 3–5 business days. You'll be notified when approved and when shipped.
          </div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn-liq btn-ghost" id="backBtn"><i class="bi bi-arrow-left"></i></button>
          <button class="btn-liq flex-grow-1" id="submitBtn"><i class="bi bi-send-fill"></i> Submit Claim</button>
        </div>
      `;

      $('#backBtn').onclick = () => this.setStep(2);
      $('#submitBtn').onclick = async () => {
        const btn = $('#submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Submitting…';
        try{
          await API.claim(AuthStore.user._id, tierNum, this.state.data);
          this.setStep(4);
        }catch(err){
          Toast.show(err.message, 'error');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-send-fill"></i> Submit Claim';
        }
      };
    }

    else if(n === 4){
      Confetti.celebrate();
      vibrate([30, 70, 30]);
      body.innerHTML = `
        <div class="text-center py-3">
          <div style="font-size:3.4rem;animation:float 3s ease-in-out infinite">🎉</div>
          <h2 class="section-title mt-3 mb-2">Claim Submitted!</h2>
          <p class="t-mid fs-8 mb-4 mw-640 mx-auto">
            Your claim for <strong class="t-gold">${escapeHtml(tier.title)}</strong> is now under review.
            We'll notify you within 3–5 business days.
          </p>
          <div class="pipeline mb-4">
            <div class="pipe-step done"><div class="pipe-line"></div><div class="pipe-dot"></div><div class="pipe-label">Claimed</div></div>
            <div class="pipe-step active"><div class="pipe-line"></div><div class="pipe-dot"></div><div class="pipe-label">Review</div></div>
            <div class="pipe-step"><div class="pipe-line"></div><div class="pipe-dot"></div><div class="pipe-label">Approved</div></div>
            <div class="pipe-step"><div class="pipe-dot"></div><div class="pipe-label">Delivered</div></div>
          </div>
          <div class="d-grid gap-2">
            <a href="#/claims" class="btn-liq">View My Claims</a>
            <a href="#/awards" class="btn-liq btn-ghost">Back to Ladder</a>
          </div>
        </div>
      `;
      setTimeout(() => Confetti.celebrate(), 400);
    }
  }
};

/* ---------------------------------------------------------------------------
   MY CLAIMS (/claims)
--------------------------------------------------------------------------- */
const ClaimsView = {
  filter: 'active',

  render(){
    const s = computeEligibility(AuthStore.user._id);
    const claims = s.claims;

    const groups = {
      active: claims.filter(c => ['claimed','under_review','approved'].includes(c.status)),
      delivered: claims.filter(c => c.status === 'fulfilled'),
      rejected: claims.filter(c => c.status === 'rejected')
    };

    const list = groups[this.filter] || [];

    return `
    <div class="view-enter">
      <div class="mb-3">
        <div class="eyebrow mb-1">History</div>
        <h1 class="section-title mb-1">My Claims</h1>
        <p class="t-mid fs-7 mb-0">Track every reward you've claimed.</p>
      </div>

      <div class="filter-tabs mb-3">
        ${[
          ['active', `Active (${groups.active.length})`],
          ['delivered', `Delivered (${groups.delivered.length})`],
          ['rejected', `Rejected (${groups.rejected.length})`]
        ].map(([k,l]) => `<button class="filter-tab ${this.filter===k?'active':''}" data-cf="${k}">${l}</button>`).join('')}
      </div>

      ${list.length ? list.map(c => this.renderClaim(c)).join('') : `
        <div class="surface surface-pad text-center py-5">
          <div style="font-size:2.6rem">📦</div>
          <h2 class="h6 mt-3 mb-1">No claims here</h2>
          <p class="fs-8 t-lo mb-3">Unlock a tier and your claims will appear here.</p>
          <a href="#/awards" class="btn-liq btn-sm-liq">View Awards Ladder</a>
        </div>
      `}

      <div class="divider"></div>
      <div class="surface surface-pad">
        <div class="eyebrow mb-3">Claim Value Summary</div>
        <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid rgba(255,255,255,.06)">
          <span class="fs-8 t-lo">Total claims</span>
          <span class="fs-8 t-hi mono">${claims.length}</span>
        </div>
        <div class="d-flex justify-content-between py-2" style="border-bottom:1px solid rgba(255,255,255,.06)">
          <span class="fs-8 t-lo">Delivered value</span>
          <span class="fs-8 t-emerald mono">${fmtNaira(
            claims.filter(c => c.status === 'fulfilled').reduce((sum,c) => {
              const t = TIER_SEED.find(x => x.tier_number === c.tier_number);
              return sum + (t ? t.estimated_value_ngn : 0);
            }, 0)
          )}</span>
        </div>
        <div class="d-flex justify-content-between py-2">
          <span class="fs-8 t-lo">Pending value</span>
          <span class="fs-8 t-gold mono">${fmtNaira(
            claims.filter(c => ['claimed','under_review','approved'].includes(c.status)).reduce((sum,c) => {
              const t = TIER_SEED.find(x => x.tier_number === c.tier_number);
              return sum + (t ? t.estimated_value_ngn : 0);
            }, 0)
          )}</span>
        </div>
      </div>
    </div>
    `;
  },

  renderClaim(c){
    const tier = TIER_SEED.find(t => t.tier_number === c.tier_number);
    if(!tier) return '';

    const stages = ['claimed','under_review','approved','fulfilled'];
    const idx = stages.indexOf(c.status === 'rejected' ? 'claimed' : c.status);

    return `
    <div class="surface surface-pad mb-3 reveal">
      <div class="d-flex align-items-start gap-3 mb-3">
        ${tierShield(tier, 52)}
        <div style="flex:1;min-width:0">
          <div class="d-flex align-items-center gap-2 flex-wrap mb-1">
            <span class="fw-bold">${escapeHtml(tier.title)}</span>
            ${statusPill(c.status)}
          </div>
          <div class="fs-8 t-mid">${escapeHtml(tier.reward_name)}</div>
          <div class="fs-9 t-lo mt-1">Claimed ${fmtDate(c.created_at)} · ${c.referrals_at_claim} referrals</div>
        </div>
      </div>

      ${c.status !== 'rejected' ? `
        <div class="pipeline">
          ${['Claimed','Review','Approved','Delivered'].map((label,i) => `
            <div class="pipe-step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
              ${i < 3 ? '<div class="pipe-line"></div>' : ''}
              <div class="pipe-dot"></div>
              <div class="pipe-label">${label}</div>
            </div>
          `).join('')}
        </div>
      ` : `
        <div class="p-3 mb-2" style="background:rgba(244,63,94,.09);border-radius:var(--r2);border:1px solid rgba(244,63,94,.22)">
          <div class="fs-8" style="color:#fda4af">
            <i class="bi bi-x-circle me-1"></i>${escapeHtml(c.rejection_reason || 'Does not meet programme terms.')}
          </div>
        </div>
      `}

      ${c.tracking_info ? `
        <div class="d-flex align-items-center gap-2 fs-8 t-mid mb-2 p-2" style="background:rgba(0,0,0,.24);border-radius:var(--r1)">
          <i class="bi bi-truck t-emerald"></i>
          Tracking: <span class="mono t-gold">${escapeHtml(c.tracking_info)}</span>
        </div>
      ` : ''}

      <button class="btn-liq btn-ghost btn-xs-liq" data-claim-detail="${c._id}">
        <i class="bi bi-eye"></i> View Details
      </button>
    </div>
    `;
  },

  mount(){
    $$('[data-cf]').forEach(b => {
      b.onclick = () => { this.filter = b.dataset.cf; Router.rerender(); };
    });

    $$('[data-claim-detail]').forEach(b => {
      b.onclick = () => {
        const claim = DB.data.awardClaims.find(c => c._id === b.dataset.claimDetail);
        if(!claim) return;
        const tier = TIER_SEED.find(t => t.tier_number === claim.tier_number);
        const d = claim.delivery_details || {};
        Sheet.open({
          title: tier ? tier.title : 'Claim',
          body: `
            <div class="text-center mb-3">${tier ? tierShield(tier, 64) : ''}</div>
            <div class="mb-3">${statusPill(claim.status)}</div>
            <div class="mb-3 p-3" style="background:rgba(0,0,0,.24);border-radius:var(--r2)">
              <div class="fs-9 t-lo mono mb-2">DELIVERY DETAILS</div>
              <div class="fs-8 t-hi">${escapeHtml(d.full_name||'')}</div>
              <div class="fs-8 t-mid">${escapeHtml(d.address_line||'')}</div>
              <div class="fs-8 t-mid">${escapeHtml(d.city||'')}, ${escapeHtml(d.state||'')}</div>
              <div class="fs-8 t-mid">${escapeHtml(d.country||'')} ${escapeHtml(d.postal_code||'')}</div>
              <div class="fs-8 t-lo mt-2">${escapeHtml(d.phone||'')} · ${escapeHtml(d.email||'')}</div>
            </div>
            <div class="p-3" style="background:rgba(0,0,0,.24);border-radius:var(--r2)">
              <div class="fs-9 t-lo mono mb-2">TIMELINE</div>
              <div class="fs-8 t-mid">Submitted · ${fmtDate(claim.created_at)}</div>
              ${claim.reviewed_at ? `<div class="fs-8 t-mid">Reviewed · ${fmtDate(claim.reviewed_at)}</div>` : ''}
              ${claim.fulfilled_at ? `<div class="fs-8 t-mid">Fulfilled · ${fmtDate(claim.fulfilled_at)}</div>` : ''}
              ${claim.tracking_info ? `<div class="fs-8 t-mid">Tracking · <span class="mono t-gold">${escapeHtml(claim.tracking_info)}</span></div>` : ''}
            </div>
          `,
          actions: [{ id:'close', label:'Close', class:'' }]
        });
      };
    });
  }
};

                   style="background:linear-gradient(${140+i*40}deg,rgba(212,175,55,.14),rgba(16,185,129,.1));
                          border:1px solid rgba(212,175,55,.22);border-radius:var(--r2);cursor:pointer">

    const doCopy = (text, msg) => {
      copyText(text).then(() => {
        vibrate(12);
        Toast.show(msg, 'success', 2400);
      }).catch(() => Toast.show('Copy failed. Please copy manually.', 'error'));
    };

    const cc = $('#copyCode');

    $$('[data-share]').forEach(b => {

        vibrate(10);
        const enc = encodeURIComponent;
        const urls = {
          whatsapp: `https://wa.me/?text=${enc(shareText)}`,
          telegram: `https://t.me/share/url?url=${enc(link)}&text=${enc('Join LIQUIDATED with my code ' + user.referral_code)}`,
          facebook: `https://www.facebook.com/sharer/sharer.php?u=${enc(link)}`,
          x: `https://twitter.com/intent/tweet?text=${enc('Join LIQUIDATED with my code ' + user.referral_code)}&url=${enc(link)}`,
          email: `mailto:?subject=${enc('Join LIQUIDATED')}&body=${enc(shareText)}`
        };
        if(t === 'copy'){ doCopy(link, 'Link copied!'); return; }
        if(t === 'native'){
          if(navigator.share){
            navigator.share({ title:'LIQUIDATED Referral', text: shareText, url: link }).catch(()=>{});
          } else {
            doCopy(link, 'Link copied (native share unavailable).');
          }
          return;
        }
        window.open(urls[t], '_blank', 'noopener,noreferrer,width=640,height=560');
      };
    });

    $$('[data-poster]').forEach(p => {
      p.onclick = () => {
        vibrate(10);
        Toast.show('Poster generation is handled by the server (Cloudinary text overlay). Link copied instead.', 'info', 4200);
        doCopy(link, 'Referral link copied for your poster.');
      };
    });

    $$('[data-rf]').forEach(b => {
      b.onclick = () => { this.filter = b.dataset.rf; Router.rerender(); };
    });
  }
};

function maskEmail(email){
  if(!email) return '';
  const [u, d] = email.split('@');
  if(!d) return email;
  const shown = u.slice(0, 2);
  return shown + '***@' + d;
}

function buildLeaderboard(){
  const rows = DB.data.users.map(u => {
    const confirmed = u._confirmed_override != null
      ? u._confirmed_override
      : DB.data.referrals.filter(r => r.referrer_id === u._id && r.status === 'completed').length;
    return { userId: u._id, name: u.name, confirmed };
  })
  .filter(r => r.confirmed > 0)
  .sort((a,b) => b.confirmed - a.confirmed)
  .slice(0,100);

  return rows.map((r,i) => ({ rank: i+1, ...r, tier: tierForCount(r.confirmed) }));
}

/* ==========================================================================
   14. ROUTER
   ========================================================================== */
const Router = {
  currentPath: '/',

  routes: [
    { re:/^\/?$/,                    view: LandingView,     key:'landing',     public:true },
    { re:/^\/login$/,                view: LoginView,       key:'login',       public:true },
    { re:/^\/support$/,              view: SupportView,     key:'support',     public:true },
    { re:/^\/dashboard$/,            view: DashboardView,   key:'dashboard' },
    { re:/^\/awards$/,               view: AwardsView,      key:'awards' },
    { re:/^\/awards\/([\w-]+)$/,     view: TierDetailView,  key:'tier',        params:['slug'] },
    { re:/^\/claim\/(\d+)$/,         view: ClaimView,       key:'claim',       params:['tierNumber'] },
    { re:/^\/claims$/,               view: ClaimsView,      key:'claims' },
    { re:/^\/referrals$/,            view: ReferralsView,   key:'referrals' },
    { re:/^\/leaderboard$/,          view: LeaderboardView, key:'leaderboard' },
    { re:/^\/profile$/,              view: ProfileView,     key:'profile' },
    { re:/^\/admin\/awards$/,        view: AdminView,       key:'admin' }
  ],

  parse(){
    const hash = location.hash.replace(/^#/, '') || '/';
    return hash.startsWith('/') ? hash : '/' + hash;
  },

  match(path){
    for(const r of this.routes){
      const m = path.match(r.re);
      if(m){
        const params = {};
        (r.params || []).forEach((p,i) => { params[p] = m[i+1]; });
        return { route: r, params };
      }
    }
    return null;
  },

  go(path){
    if(this.parse() === path){ this.rerender(); return; }
    location.hash = '#' + path;
  },

  rerender(){
    const view = $('#view');
    const path = this.parse();
    this.currentPath = path;

    const matched = this.match(path) || { route:{ view: NotFoundView, key:'404', public:true }, params:{} };

    // Auth guard
    if(!matched.route.public && !AuthStore.isAuthed){
      Toast.show('Please sign in to continue.', 'info', 2600);
      location.hash = '#/login';
      return;
    }

    // Scroll to top
    window.scrollTo({ top:0, behavior: prefersReducedMotion() ? 'auto' : 'smooth' });

    // Render
    const html = matched.route.view.render(matched.params);
    view.innerHTML = html;

    // Mount
    if(matched.route.view.mount){
      try{ matched.route.view.mount(matched.params); }catch(e){ console.warn(e); }
    }

    // Post-render
    animateProgress();
    initReveal(view);
    renderDock();
    renderTopBar();
    this.updateDocumentTitle(matched.route.key);
  },

  updateDocumentTitle(key){
    const titles = {
      landing:'LIQUIDATED Referral Awards — Unlock Extraordinary Rewards',
      login:'Sign In · LIQUIDATED Awards',
      dashboard:'Dashboard · LIQUIDATED Awards',
      awards:'Awards Ladder · LIQUIDATED Awards',
      tier:'Tier Detail · LIQUIDATED Awards',
      claim:'Claim Reward · LIQUIDATED Awards',
      claims:'My Claims · LIQUIDATED Awards',
      referrals:'Referrals · LIQUIDATED Awards',
      leaderboard:'Leaderboard · LIQUIDATED Awards',
      profile:'Profile · LIQUIDATED Awards',
      support:'Support · LIQUIDATED Awards',
      admin:'Claim Review · LIQUIDATED Awards',
      '404':'Not Found · LIQUIDATED Awards'
    };
    document.title = titles[key] || titles.landing;
  },

  init(){
    window.addEventListener('hashchange', () => this.rerender());
    this.rerender();
  }
};

/* ==========================================================================
   15. PERFORMANCE BEHAVIOUR
   ========================================================================== */
document.addEventListener('visibilitychange', () => {
  document.body.classList.toggle('tab-hidden', document.visibilityState === 'hidden');
});

/* Pause confetti when hidden to save battery */
let wasVisible = true;
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'hidden'){ wasVisible = false; }
  else if(!wasVisible){ wasVisible = true; }
});

/* Passive scroll listeners for future parallax */
let rafScroll = null;
window.addEventListener('scroll', () => {
  if(rafScroll) return;
  rafScroll = requestAnimationFrame(() => { rafScroll = null; });
}, { passive:true });

/* Battery-aware: reduce animation on low battery */
if(navigator.getBattery){
  navigator.getBattery().then(b => {
    const apply = () => {
      if(b.level < 0.15 && !b.charging){
        document.documentElement.style.setProperty('--t-slow', '120ms');
        document.querySelectorAll('.orb').forEach(o => o.style.animationPlayState = 'paused');
      }
    };
    apply();
    b.addEventListener('levelchange', apply);
  }).catch(()=>{});
}

/* ==========================================================================
   16. BOOTSTRAP / INIT
   ========================================================================== */
function boot(){
  DB.load();
  AuthStore.hydrate();

  // Handle ?ref= in URL (referral capture)
  const params = new URLSearchParams(location.search);
  const ref = params.get('ref');
  if(ref){
    try{ localStorage.setItem('liq_pending_ref', ref); }catch(e){}
    setTimeout(() => Toast.show('Referral code captured: ' + ref, 'info', 3600), 900);
  }

  renderTopBar();
  renderDock();
  Router.init();

  // Automation button
  $('#autoBtn').onclick = () => {
    vibrate(12);
    Automation.openConsole();
  };

  // Start schedulers
  Automation.startSchedulers();

  // First-run seed log
  Automation.record('seed-award-tiers.js', 'ok', '12 tier definitions verified at boot.');

  // Welcome toast (first visit only)
  try{
    if(!localStorage.getItem('liq_welcomed')){
      localStorage.setItem('liq_welcomed', '1');
      setTimeout(() => {
        Toast.show('Welcome to LIQUIDATED Awards. Sign in with the demo account to explore.', 'gold', 5200);
      }, 1200);
    }
  }catch(e){}

  // Global error safety net
  window.addEventListener('error', (e) => {
    console.warn('[LIQUIDATED] runtime error:', e.message);
  });

  // Keyboard shortcut: Ctrl/Cmd + K → automation console
  window.addEventListener('keydown', (e) => {
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){
      e.preventDefault();
      Automation.openConsole();
    }
  });

  // Escape closes sheet
  window.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') Sheet.close();
  });

  console.log('%cLIQUIDATED AWARDS', 'color:#d4af37;font-weight:800;font-size:16px');
  console.log('%c12 tiers · gold + emerald · mobile-first', 'color:#10b981;font-size:11px');
  console.log('%cAutomation console: Ctrl/Cmd + K', 'color:#7fa595;font-size:11px');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* Expose for debugging / automation */
window.Liquidated = {
  DB, API, AuthStore, Router, Automation, Confetti, Toast, Sheet,
  computeEligibility, TIER_SEED, buildLeaderboard
};

})();
</script>
